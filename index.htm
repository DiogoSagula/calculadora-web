<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="calculator-container">
        
        <header class="calc-header">
            <button id="theme-toggle" class="icon-btn" title="Alternar Tema">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button id="history-toggle" class="icon-btn" title="Histórico">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
        </header>

       
        <div class="display">
            <div id="previous-operation" class="previous-operation"></div>
            <div id="current-operation" class="current-operation">0</div>
        </div>

        
        <div class="keypad">
            <button class="btn function" data-action="clear">C</button>
            <button class="btn function" data-action="backspace"><i class="fa-solid fa-delete-left"></i></button>
            <button class="btn function" data-action="percent">%</button>
            <button class="btn operator" data-operator="÷">÷</button>

            <button class="btn number" data-number="7">7</button>
            <button class="btn number" data-number="8">8</button>
            <button class="btn number" data-number="9">9</button>
            <button class="btn operator" data-operator="×">×</button>

            <button class="btn number" data-number="4">4</button>
            <button class="btn number" data-number="5">5</button>
            <button class="btn number" data-number="6">6</button>
            <button class="btn operator" data-operator="-">-</button>

            <button class="btn number" data-number="1">1</button>
            <button class="btn number" data-number="2">2</button>
            <button class="btn number" data-number="3">3</button>
            <button class="btn operator" data-operator="+">+</button>

            <button class="btn function" data-action="sqrt">√</button>
            <button class="btn number" data-number="0">0</button>
            <button class="btn number" data-number=".">.</button>
            <button class="btn equals" data-action="calculate">=</button>
        </div>
    </div>

    
    <aside id="history-panel" class="history-panel">
        <div class="history-header">
            <h3>Histórico</h3>
            <button id="clear-history" class="text-btn">Limpar</button>
        </div>
        <ul id="history-list" class="history-list">
        </ul>
    </aside>

    <script src="script.js"></script>
</body>
</html>
